<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food share in each diet</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--fg:#202421;--muted:#626963;--grid:#d9ddd8;--panel:#fff;--a:#687078;--b:#2274a5;--c:#2f855a;--c2:#c2672d}
@media(prefers-color-scheme:dark){:root{--bg:#171918;--fg:#f0f2ef;--muted:#aeb5af;--grid:#3d423e;--panel:#202321;--a:#aab1b7;--b:#55a9d9;--c:#65bc88;--c2:#e69a61}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 24px 48px}h1{font-size:28px;font-weight:500;margin:0 0 6px}.subtitle{color:var(--muted);max-width:780px;margin:0 0 18px}.legend{display:flex;gap:12px 22px;flex-wrap:wrap;margin:0 0 22px}.legend-item{display:flex;align-items:center;gap:7px}.swatch{width:12px;height:12px;border-radius:2px}.legend-total{color:var(--muted);font-variant-numeric:tabular-nums}.axis{display:grid;grid-template-columns:minmax(180px,260px) 1fr;margin-bottom:6px}.axis-title{color:var(--muted)}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--grid);padding-bottom:4px}.group-title{font-size:16px;font-weight:500;margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--grid)}.food-row{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:14px;align-items:start;padding:7px 0}.food-label{padding-top:5px}.series{display:grid;gap:4px}.series-row{display:grid;grid-template-columns:34px 1fr 52px;gap:7px;align-items:center;min-height:20px}.series-key{color:var(--muted);font-size:12px}.track{height:16px;background:color-mix(in srgb,var(--grid) 42%,transparent);position:relative}.bar{height:100%;min-width:0}.value{font-variant-numeric:tabular-nums;text-align:right}.zero{color:var(--muted);font-size:12px}.a{background:var(--a)}.b{background:var(--b)}.c{background:var(--c)}.c2{background:var(--c2)}
@media(max-width:620px){.wrap{padding:20px 14px 36px}.axis{display:block}.axis-title{margin-bottom:4px}.food-row{grid-template-columns:1fr;gap:4px}.food-label{font-weight:500}.series-row{grid-template-columns:30px 1fr 48px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
<h1>Food share in each diet</h1>
<p class="subtitle">Each row compares the same food across four diets. Values are percentages of that diet's total daily mass.</p>
<div class="legend" id="legend" aria-label="Diet scenarios"></div>
<div class="axis"><div class="axis-title">Share of diet mass (%)</div><div class="ticks" id="ticks"></div></div>
<div id="chart"></div>
</main>
<script id="chart-data" type="application/json">{"population": 1339785, "scenarios": [{"key": "A", "label": "Current diet", "total_g_per_day": 1273.6}, {"key": "B", "label": "TAI-recommended diet", "total_g_per_day": 2141.9}, {"key": "C", "label": "EAT-Lancet 2019", "total_g_per_day": 1568.7}, {"key": "C2", "label": "EAT-Lancet 2025", "total_g_per_day": 1666.9}], "rows": [{"group": "Dairy products", "item": "(total)", "label": "Dairy products", "percentages": {"A": 23.3, "B": 22.9, "C": 14.5, "C2": 13.4}, "grams": {"A": 296.4, "B": 490.1, "C": 226.9, "C2": 224.0}}, {"group": "Vegetables, fruits & berries", "item": "Vegetables", "label": "Vegetables", "percentages": {"A": 10.6, "B": 22.4, "C": 14.8, "C2": 17.7}, "grams": {"A": 135.6, "B": 479.4, "C": 232.4, "C2": 294.8}}, {"group": "Vegetables, fruits & berries", "item": "Fruits+Berries (combined)", "label": "Fruits+Berries (combined)", "percentages": {"A": 16.7, "B": 12.4, "C": 14.4, "C2": 16.2}, "grams": {"A": 212.1, "B": 265.6, "C": 225.2, "C2": 270.0}}, {"group": "Vegetables, fruits & berries", "item": "Legumes", "label": "Legumes", "percentages": {"A": 0.0, "B": 2.7, "C": 12.4, "C2": 11.8}, "grams": {"A": 0.0, "B": 57.1, "C": 195.2, "C2": 196.9}}, {"group": "Sweets, snacks & discretionary", "item": "(total)", "label": "Sweets, snacks & discretionary", "percentages": {"A": 12.5, "B": 2.4, "C": 2.2, "C2": 2.0}, "grams": {"A": 159.0, "B": 51.4, "C": 33.8, "C2": 33.7}}, {"group": "Grain products & potatoes", "item": "Porridges/pasta/rice/grain products", "label": "Porridges/pasta/rice/grain products", "percentages": {"A": 9.9, "B": 12.2, "C": 18.9, "C2": 16.8}, "grams": {"A": 125.9, "B": 262.0, "C": 296.7, "C2": 280.1}}, {"group": "Grain products & potatoes", "item": "High-fibre bread/baked goods", "label": "High-fibre bread/baked goods", "percentages": {"A": 5.8, "B": 6.2, "C": 9.5, "C2": 8.5}, "grams": {"A": 73.7, "B": 131.8, "C": 149.2, "C2": 140.9}}, {"group": "Grain products & potatoes", "item": "Potato, sweet potato", "label": "Potato, sweet potato", "percentages": {"A": 7.7, "B": 8.3, "C": 3.0, "C2": 3.7}, "grams": {"A": 97.8, "B": 177.8, "C": 46.5, "C2": 62.1}}, {"group": "Fish, eggs & meat", "item": "Red meat", "label": "Red meat", "percentages": {"A": 5.6, "B": 0.9, "C": 0.8, "C2": 1.2}, "grams": {"A": 70.7, "B": 20.2, "C": 12.6, "C2": 19.6}}, {"group": "Fish, eggs & meat", "item": "Fish & seafood", "label": "Fish & seafood", "percentages": {"A": 1.8, "B": 3.7, "C": 1.5, "C2": 0.9}, "grams": {"A": 23.5, "B": 79.6, "C": 24.0, "C2": 15.6}}, {"group": "Fish, eggs & meat", "item": "Poultry", "label": "Poultry", "percentages": {"A": 2.9, "B": 1.8, "C": 1.7, "C2": 1.7}, "grams": {"A": 37.0, "B": 38.5, "C": 27.4, "C2": 27.6}}, {"group": "Fish, eggs & meat", "item": "Eggs", "label": "Eggs", "percentages": {"A": 1.6, "B": 1.4, "C": 0.8, "C2": 0.8}, "grams": {"A": 20.6, "B": 30.0, "C": 12.7, "C2": 14.0}}, {"group": "Nuts, seeds, oils & fats", "item": "Nuts+Seeds,cocoa (combined)", "label": "Nuts+Seeds,cocoa (combined)", "percentages": {"A": 0.3, "B": 1.8, "C": 2.9, "C2": 2.7}, "grams": {"A": 3.3, "B": 37.8, "C": 45.9, "C2": 45.2}}, {"group": "Nuts, seeds, oils & fats", "item": "Oils/fats/spreads (rapeseed, representative)", "label": "Oils/fats/spreads (rapeseed, representative)", "percentages": {"A": 1.4, "B": 1.0, "C": 2.6, "C2": 2.5}, "grams": {"A": 18.0, "B": 20.6, "C": 40.2, "C2": 42.4}}]}</script>
<script>
const data=JSON.parse(document.getElementById('chart-data').textContent);
const colors={A:'a',B:'b',C:'c',C2:'c2'};
const maximum=Math.max(...data.rows.flatMap(row=>Object.values(row.percentages)));
const scaleMax=Math.max(5,Math.ceil(maximum/5)*5);
const legend=document.getElementById('legend');
data.scenarios.forEach(s=>{const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<span class="swatch ${colors[s.key]}"></span><span>${s.label}</span><span class="legend-total">${s.total_g_per_day.toFixed(1)} g/day total</span>`;legend.appendChild(item)});
const ticks=document.getElementById('ticks');for(let i=0;i<=5;i++){const tick=document.createElement('span');tick.textContent=(scaleMax*i/5).toFixed(0)+'%';ticks.appendChild(tick)}
const chart=document.getElementById('chart');let group='';
data.rows.forEach(row=>{if(row.group!==group){group=row.group;const heading=document.createElement('h2');heading.className='group-title';heading.textContent=group;chart.appendChild(heading)}const food=document.createElement('div');food.className='food-row';const label=document.createElement('div');label.className='food-label';label.textContent=row.label;food.appendChild(label);const series=document.createElement('div');series.className='series';data.scenarios.forEach(s=>{const pct=row.percentages[s.key];const grams=row.grams[s.key];const line=document.createElement('div');line.className='series-row';line.innerHTML=`<span class="series-key">${s.key}</span><div class="track"><div class="bar ${colors[s.key]}" style="width:${pct/scaleMax*100}%" role="img" aria-label="${row.label}, ${s.label}: ${pct.toFixed(1)}%, ${grams.toFixed(1)} g/day"></div></div><span class="value ${pct===0?'zero':''}">${pct===0?'—':pct.toFixed(1)+'%'}</span>`;series.appendChild(line)});food.appendChild(series);chart.appendChild(food)});
</script>
</body>
</html>
