<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--fg:#202421;--muted:#626963;--grid:#d9ddd8;--a:#687078;--b:#2274a5;--c:#2f855a;--c2:#c2672d}
@media(prefers-color-scheme:dark){:root{--bg:#171918;--fg:#f0f2ef;--muted:#aeb5af;--grid:#3d423e;--a:#aab1b7;--b:#55a9d9;--c:#65bc88;--c2:#e69a61}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 22px 38px}h1{font-size:25px;font-weight:500;margin:0 0 5px}.subtitle{color:var(--muted);max-width:760px;margin:0 0 14px}.legend{display:flex;gap:10px 20px;flex-wrap:wrap;margin-bottom:16px}.legend-item{display:flex;align-items:center;gap:6px}.dot-swatch,.dot{display:block;border-radius:50%}.dot-swatch{width:10px;height:10px}.a{background:var(--a)}.b{background:var(--b)}.c{background:var(--c)}.c2{background:var(--c2)}.axis,.food-row{display:grid;grid-template-columns:minmax(190px,270px) 1fr;gap:16px}.axis{align-items:end;color:var(--muted);margin-bottom:3px}.ticks{height:22px;position:relative;border-bottom:1px solid var(--grid)}.ticks span{position:absolute;bottom:3px;transform:translateX(-50%);font-variant-numeric:tabular-nums;font-size:12px}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}.group-title{font-size:14px;font-weight:500;margin:14px 0 2px;padding:4px 0;border-bottom:1px solid var(--grid)}.food-row{align-items:center;min-height:35px}.food-label{line-height:1.2}.plot{height:32px;position:relative;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:20% 100%;border-right:1px solid var(--grid)}.diet-lane{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--grid) 42%,transparent)}.dot{position:absolute;z-index:1;width:10px;height:10px;transform:translateX(-50%);box-shadow:0 0 0 1px var(--bg);cursor:default}.dot::after{content:attr(data-tip);position:absolute;left:50%;bottom:15px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:3px 6px;white-space:nowrap;border-radius:3px;font-size:12px;opacity:0;pointer-events:none;z-index:2}.dot:hover::after{opacity:1}
@media(max-width:620px){.wrap{padding:18px 12px 30px}h1{font-size:21px}.axis,.food-row{grid-template-columns:minmax(125px,42%) 1fr;gap:8px}.food-label{font-size:12px}.legend{gap:8px 14px}.group-title{margin-top:12px}}
</style>
</head>
<body>
<main class="wrap">
<h1>__TITLE__</h1>
<p class="subtitle">__SUBTITLE__</p>
<div class="legend" aria-label="Diet scenarios">__LEGEND__</div>
<div class="axis"><div>__AXIS__</div><div class="ticks">__TICKS__</div></div>
<div class="chart">__CHART__</div>
</main>
</body>
</html>
