<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--fg:#202421;--muted:#626963;--grid:#d9ddd8;--panel:#fff;--a:#687078;--b:#2274a5;--c:#2f855a;--c2:#c2672d}
@media(prefers-color-scheme:dark){:root{--bg:#171918;--fg:#f0f2ef;--muted:#aeb5af;--grid:#3d423e;--panel:#202321;--a:#aab1b7;--b:#55a9d9;--c:#65bc88;--c2:#e69a61}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 24px 48px}h1{font-size:28px;font-weight:500;margin:0 0 6px}.subtitle{color:var(--muted);max-width:780px;margin:0 0 18px}.legend{display:flex;gap:12px 22px;flex-wrap:wrap;margin:0 0 22px}.legend-item{display:flex;align-items:center;gap:7px}.swatch{width:12px;height:12px;border-radius:2px}.legend-total{color:var(--muted);font-variant-numeric:tabular-nums}.axis{display:grid;grid-template-columns:minmax(180px,260px) 1fr;margin-bottom:6px}.axis-title{color:var(--muted)}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--grid);padding-bottom:4px}.group-title{font-size:16px;font-weight:500;margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--grid)}.food-row{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:14px;align-items:start;padding:7px 0}.food-label{padding-top:5px}.series{display:grid;gap:4px}.series-row{display:grid;grid-template-columns:34px 1fr 52px;gap:7px;align-items:center;min-height:20px}.series-key{color:var(--muted);font-size:12px}.track{height:16px;background:color-mix(in srgb,var(--grid) 42%,transparent);position:relative}.bar{height:100%;min-width:0}.value{font-variant-numeric:tabular-nums;text-align:right}.zero{color:var(--muted);font-size:12px}.a{background:var(--a)}.b{background:var(--b)}.c{background:var(--c)}.c2{background:var(--c2)}
@media(max-width:620px){.wrap{padding:20px 14px 36px}.axis{display:block}.axis-title{margin-bottom:4px}.food-row{grid-template-columns:1fr;gap:4px}.food-label{font-weight:500}.series-row{grid-template-columns:30px 1fr 48px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
<h1>__TITLE__</h1>
<p class="subtitle">__SUBTITLE__</p>
<div class="legend" id="legend" aria-label="Diet scenarios"></div>
<div class="axis"><div class="axis-title">__AXIS__</div><div class="ticks" id="ticks"></div></div>
<div id="chart"></div>
</main>
<script id="chart-data" type="application/json">__BAR_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('chart-data').textContent);
const colors={A:'a',B:'b',C:'c',C2:'c2'};
const maximum=Math.max(...data.rows.flatMap(row=>Object.values(row.percentages)));
const scaleMax=Math.max(5,Math.ceil(maximum/5)*5);
const legend=document.getElementById('legend');
data.scenarios.forEach(s=>{const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<span class="swatch ${colors[s.key]}"></span><span>${s.label}</span><span class="legend-total">${s.total_g_per_day.toFixed(1)} __UNIT__ __TOTAL__</span>`;legend.appendChild(item)});
const ticks=document.getElementById('ticks');for(let i=0;i<=5;i++){const tick=document.createElement('span');tick.textContent=(scaleMax*i/5).toFixed(0)+'%';ticks.appendChild(tick)}
const chart=document.getElementById('chart');let group='';
data.rows.forEach(row=>{if(row.group!==group){group=row.group;const heading=document.createElement('h2');heading.className='group-title';heading.textContent=group;chart.appendChild(heading)}const food=document.createElement('div');food.className='food-row';const label=document.createElement('div');label.className='food-label';label.textContent=row.label;food.appendChild(label);const series=document.createElement('div');series.className='series';data.scenarios.forEach(s=>{const pct=row.percentages[s.key];const grams=row.grams[s.key];const line=document.createElement('div');line.className='series-row';line.innerHTML=`<span class="series-key">${s.key}</span><div class="track"><div class="bar ${colors[s.key]}" style="width:${pct/scaleMax*100}%" role="img" aria-label="${row.label}, ${s.label}: ${pct.toFixed(1)}%, ${grams.toFixed(1)} __UNIT__"></div></div><span class="value ${pct===0?'zero':''}">${pct===0?'—':pct.toFixed(1)+'%'}</span>`;series.appendChild(line)});food.appendChild(series);chart.appendChild(food)});
</script>
</body>
</html>
