<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--fg:#202421;--muted:#626963;--grid:#d9ddd8;--a:#687078;--b:#2274a5;--c:#2f855a;--c2:#c2672d}
@media(prefers-color-scheme:dark){:root{--bg:#171918;--fg:#f0f2ef;--muted:#aeb5af;--grid:#3d423e;--a:#aab1b7;--b:#55a9d9;--c:#65bc88;--c2:#e69a61}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:30px 28px 46px}h1{font-size:34px;font-weight:500;margin:0 0 7px}.subtitle{color:var(--muted);max-width:960px;margin:0 0 18px}.legend{display:flex;gap:12px 26px;flex-wrap:wrap;margin-bottom:20px}.legend-item{display:flex;align-items:center;gap:8px}.dot-swatch,.dot{display:block;border-radius:50%}.dot-swatch{width:13px;height:13px}.a{background:var(--a)}.b{background:var(--b)}.c{background:var(--c)}.c2{background:var(--c2)}.axis,.food-row{display:grid;grid-template-columns:minmax(250px,350px) 1fr;gap:20px}.axis{align-items:end;color:var(--muted);margin-bottom:5px}.ticks{height:28px;position:relative;border-bottom:1px solid var(--grid)}.ticks span{position:absolute;bottom:4px;transform:translateX(-50%);font-variant-numeric:tabular-nums;font-size:16px}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}.group-title{font-size:20px;font-weight:600;margin:18px 0 3px;padding:5px 0;border-bottom:1px solid var(--grid)}.food-row{align-items:center;min-height:49px}.food-label{font-size:18px;line-height:1.25}.plot{height:46px;position:relative;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:20% 100%;border-right:1px solid var(--grid)}.diet-lane{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--grid) 42%,transparent)}.dot{position:absolute;z-index:1;width:12px;height:12px;transform:translateX(-50%);box-shadow:0 0 0 1px var(--bg);cursor:default}.dot::after{content:attr(data-tip);position:absolute;left:50%;bottom:17px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:4px 7px;white-space:nowrap;border-radius:3px;font-size:16px;opacity:0;pointer-events:none;z-index:2}.dot:hover::after{opacity:1}
@media(max-width:620px){.wrap{padding:20px 14px 32px}h1{font-size:28px}.axis,.food-row{grid-template-columns:minmax(165px,44%) 1fr;gap:10px}.food-label{font-size:15px}.legend{gap:9px 16px}.group-title{margin-top:15px}}
</style>
</head>
<body>
<main class="wrap">
<h1>__TITLE__</h1>
<p class="subtitle">__SUBTITLE__</p>
<div class="legend" aria-label="Diet scenarios">__LEGEND__</div>
<div class="axis"><div>__AXIS__</div><div class="ticks">__TICKS__</div></div>
<div class="chart">__CHART__</div>
</main>
</body>
</html>
